<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Round 6 — Participantes</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <div class="symbols" aria-hidden="true">○ △ □</div>
        <p class="eyebrow">O jogo vai começar</p>
        <h1>PARTICIPANTES<span>.</span></h1>
        <p class="instructions">Selecione uma foto para deixá-la em tons de cinza. Selecione novamente para restaurar a cor.</p>
        <p id="selection-count" class="selection-count" role="status">0 de 8 participantes selecionados</p>
      </header>

      <section class="participants" aria-label="Participantes do jogo">
        <button class="participant" type="button" aria-pressed="false" aria-label="Selecionar Ana, participante 001">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&amp;fit=crop&amp;w=500&amp;h=600&amp;q=80" alt="Foto de Ana" width="500" height="600">
          <span class="number">001</span>
          <span class="participant-info"><span class="name">Ana</span><span class="state">Em jogo</span></span>
        </button>
        <button class="participant" type="button" aria-pressed="false" aria-label="Selecionar Bruno, participante 067">
          <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&amp;fit=crop&amp;w=500&amp;h=600&amp;q=80" alt="Foto de Bruno" width="500" height="600">
          <span class="number">067</span>
          <span class="participant-info"><span class="name">Bruno</span><span class="state">Em jogo</span></span>
        </button>
        <button class="participant" type="button" aria-pressed="false" aria-label="Selecionar Camila, participante 101">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&amp;fit=crop&amp;w=500&amp;h=600&amp;q=80" alt="Foto de Camila" width="500" height="600">
          <span class="number">101</span>
          <span class="participant-info"><span class="name">Camila</span><span class="state">Em jogo</span></span>
        </button>
        <button class="participant" type="button" aria-pressed="false" aria-label="Selecionar Diego, participante 199">
          <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&amp;fit=crop&amp;w=500&amp;h=600&amp;q=80" alt="Foto de Diego" width="500" height="600">
          <span class="number">199</span>
          <span class="participant-info"><span class="name">Diego</span><span class="state">Em jogo</span></span>
        </button>
        <button class="participant" type="button" aria-pressed="false" aria-label="Selecionar Elisa, participante 212">
          <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&amp;fit=crop&amp;w=500&amp;h=600&amp;q=80" alt="Foto de Elisa" width="500" height="600">
          <span class="number">212</span>
          <span class="participant-info"><span class="name">Elisa</span><span class="state">Em jogo</span></span>
        </button>
        <button class="participant" type="button" aria-pressed="false" aria-label="Selecionar Felipe, participante 218">
          <img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&amp;fit=crop&amp;w=500&amp;h=600&amp;q=80" alt="Foto de Felipe" width="500" height="600">
          <span class="number">218</span>
          <span class="participant-info"><span class="name">Felipe</span><span class="state">Em jogo</span></span>
        </button>
        <button class="participant" type="button" aria-pressed="false" aria-label="Selecionar Gabriela, participante 240">
          <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&amp;fit=crop&amp;w=500&amp;h=600&amp;q=80" alt="Foto de Gabriela" width="500" height="600">
          <span class="number">240</span>
          <span class="participant-info"><span class="name">Gabriela</span><span class="state">Em jogo</span></span>
        </button>
        <button class="participant" type="button" aria-pressed="false" aria-label="Selecionar Henrique, participante 456">
          <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&amp;fit=crop&amp;w=500&amp;h=600&amp;q=80" alt="Foto de Henrique" width="500" height="600">
          <span class="number">456</span>
          <span class="participant-info"><span class="name">Henrique</span><span class="state">Em jogo</span></span>
        </button>
      </section>
      <footer>Oito jogadores. Você decide quem continua.</footer>
    </main>
  </body>
</html>
