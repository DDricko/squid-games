<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Round 6 — Participantes</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <div class="symbols" aria-hidden="true">○ △ □</div>
        <p class="eyebrow">O jogo vai começar</p>
        <h1>PARTICIPANTES<span>.</span></h1>
        <p class="instructions">Selecione uma foto para deixá-la em tons de cinza. Selecione novamente para restaurar a cor. Use “Trocar foto” para escolher uma imagem do computador.</p>
        <p id="selection-count" class="selection-count" role="status">0 de 8 participantes selecionados</p>
      </header>

      <section class="participants" aria-label="Participantes do jogo">
        <article class="participant-card">
          <button class="participant" type="button" aria-pressed="false" aria-label="Selecionar Ana, participante 001">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&amp;fit=crop&amp;w=500&amp;h=600&amp;q=80" alt="Foto de Ana" width="500" height="600">
            <span class="number">001</span>
            <span class="participant-info"><span class="name">Ana</span><span class="state">Em jogo</span></span>
          </button>
          <label class="photo-picker" for="photo-ana">Trocar foto
            <input id="photo-ana" class="photo-input" type="file" accept="image/*" aria-label="Escolher foto para Ana">
          </label>
          <span class="photo-status" role="status" aria-live="polite"></span>
        </article>
        <article class="participant-card">
          <button class="participant" type="button" aria-pressed="false" aria-label="Selecionar Bruno, participante 067">

            <span class="number">067</span>
            <span class="participant-info"><span class="name">Bruno</span><span class="state">Em jogo</span></span>
          </button>
          <label class="photo-picker" for="photo-bruno">Trocar foto

          </label>
          <span class="photo-status" role="status" aria-live="polite"></span>
        </article>

      <footer>Oito jogadores. Você decide quem continua.</footer>
